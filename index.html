<!doctype html>
<html lang="en" data-palette="sour-patch" data-mode="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jacob McKiernan — Full-Stack Engineer</title>
    <meta name="description" content="Jacob McKiernan, full-stack engineer. Projects, toolkit and contact." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!--
      Runs before the first paint so returning visitors never see the wrong theme flash in.
      Keep the storage keys in sync with src/hooks/useTheme.ts and useMotion.ts.
    -->
    <script>
      ;(function () {
        var root = document.documentElement
        var palette = null
        var mode = null
        try {
          palette = localStorage.getItem('theme-palette')
          mode = localStorage.getItem('theme-mode')
          if (localStorage.getItem('motion') === 'paused') root.dataset.motion = 'paused'
        } catch (e) {}
        if (palette) root.dataset.palette = palette
        if (mode === 'light' || mode === 'dark') root.dataset.mode = mode
      })()
    </script>

    <!--
      The fonts that draw the first screen. Without this, the browser only finds them after the CSS
      arrives. Fonts always load in CORS mode, so without crossorigin these would download twice.
    -->
    <link rel="preload" href="/src/assets/fonts/special-elite.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/bowlby-one.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/rubik-mono-one.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
